name: Fix workspace context

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Fix workspace context and activity deletion')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend workspace scoping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text()
          old = 'raw=request.headers.get("X-Workspace-ID") or request.args.get("workspaceId") or request.get_json(silent=True).get("workspaceId") if request.is_json else None'
          new = 'body=request.get_json(silent=True) if request.is_json else {}\n    raw=request.headers.get("X-Workspace-ID") or request.args.get("workspaceId") or (body or {}).get("workspaceId")'
          if old in s:
              s = s.replace(old, new, 1)

          old_projects = '''    ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id)\n    ps=Project.query.filter(Project.id.in_(ids)).order_by(Project.created_at.desc()).all()'''
          new_projects = '''    ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id)\n    if m.role not in {"Admin","Manager"}:\n        assigned_ids=db.session.query(ProjectMember.project_id).filter(ProjectMember.user_id==int(get_jwt_identity()))\n        ids=ids.filter(ProjectWorkspace.project_id.in_(assigned_ids))\n    ps=Project.query.filter(Project.id.in_(ids)).order_by(Project.created_at.desc()).all()'''
          if old_projects in s:
              s=s.replace(old_projects,new_projects,1)

          old_tasks = '    migrate_legacy_links();ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id);ts=Task.query.filter(Task.project_id.in_(ids)).order_by(Task.created_at.desc()).all();return ok({"tasks":[task_payload(t) for t in ts]})'
          new_tasks = '''    migrate_legacy_links();ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id)\n    if m.role not in {"Admin","Manager"}:\n        assigned_ids=db.session.query(ProjectMember.project_id).filter(ProjectMember.user_id==int(get_jwt_identity()))\n        ids=ids.filter(ProjectWorkspace.project_id.in_(assigned_ids))\n    ts=Task.query.filter(Task.project_id.in_(ids),Task.assignee_id==int(get_jwt_identity())).order_by(Task.created_at.desc()).all();return ok({"tasks":[task_payload(t) for t in ts]})'''
          if old_tasks in s:
              s=s.replace(old_tasks,new_tasks,1)

          old_summary = '    migrate_legacy_links();ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id);ps=Project.query.filter(Project.id.in_(ids)).order_by(Project.created_at.desc()).all();ts=Task.query.filter(Task.project_id.in_(ids)).all();counts={s:sum(t.status==s for t in ts) for s in TASK_STATUSES};members=Membership.query.filter_by(workspace_id=w.id).count();acts=Activity.query.join(Membership,Membership.user_id==Activity.user_id).filter(Membership.workspace_id==w.id).order_by(Activity.created_at.desc()).limit(10).all()'
          new_summary = '''    migrate_legacy_links();ids=db.session.query(ProjectWorkspace.project_id).filter(ProjectWorkspace.workspace_id==w.id)\n    if m.role not in {"Admin","Manager"}:\n        assigned_ids=db.session.query(ProjectMember.project_id).filter(ProjectMember.user_id==int(get_jwt_identity()))\n        ids=ids.filter(ProjectWorkspace.project_id.in_(assigned_ids))\n        ts=Task.query.filter(Task.project_id.in_(ids),Task.assignee_id==int(get_jwt_identity())).all()\n    else:\n        ts=Task.query.filter(Task.project_id.in_(ids)).all()\n    ps=Project.query.filter(Project.id.in_(ids)).order_by(Project.created_at.desc()).all();counts={s:sum(t.status==s for t in ts) for s in TASK_STATUSES};members=Membership.query.filter_by(workspace_id=w.id).count();acts=Activity.query.join(Membership,Membership.user_id==Activity.user_id).filter(Membership.workspace_id==w.id).order_by(Activity.created_at.desc()).limit(10).all()'''
          if old_summary in s:
              s=s.replace(old_summary,new_summary,1)

          marker='@app.get("/api/notifications")'
          route='''@app.delete("/api/activity/<int:aid>")\n@require_role("Admin")\ndef delete_activity(aid):\n    m,w=current_context(int(get_jwt_identity()))\n    a=Activity.query.get(aid)\n    if not m or not a:\n        return error("Activity not found.",404,"ACTIVITY_NOT_FOUND")\n    if not Membership.query.filter_by(workspace_id=w.id,user_id=a.user_id).first():\n        return error("Activity not found.",404,"ACTIVITY_NOT_FOUND")\n    db.session.delete(a);db.session.commit();return ok({"message":"Activity deleted."})\n\n'''
          if route not in s and marker in s:
              s=s.replace(marker,route+marker,1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app.py
          git diff --cached --quiet || git commit -m 'Fix workspace context and activity deletion'
          git push
