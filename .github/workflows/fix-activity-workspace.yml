name: Fix activity workspace isolation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Automated: scope activity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch activity workspace scoping
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/app.py')
          s = p.read_text(encoding='utf-8')

          # Store workspace ownership on every activity row.
          old = 'class Activity(db.Model):\n    id=db.Column(db.Integer,primary_key=True); user_id=db.Column(db.Integer,db.ForeignKey("user.id"),nullable=False,index=True); action=db.Column(db.String(180),nullable=False); context=db.Column(db.String(180),default=""); created_at=db.Column(db.DateTime,server_default=db.func.now(),index=True); user=db.relationship("User",foreign_keys=[user_id])'
          new = 'class Activity(db.Model):\n    id=db.Column(db.Integer,primary_key=True); user_id=db.Column(db.Integer,db.ForeignKey("user.id"),nullable=False,index=True); workspace_id=db.Column(db.Integer,db.ForeignKey("workspaces.id",ondelete="CASCADE"),nullable=True,index=True); action=db.Column(db.String(180),nullable=False); context=db.Column(db.String(180),default=""); created_at=db.Column(db.DateTime,server_default=db.func.now(),index=True); user=db.relationship("User",foreign_keys=[user_id])'
          if old in s:
              s = s.replace(old, new, 1)

          # Scope every activity creation to the active workspace. This keeps activity
          # separate even when the same user belongs to multiple workspaces.
          s = s.replace('Activity(action=', 'Activity(workspace_id=g.workspace.id,action=')
          s = s.replace('Activity(user_id=', 'Activity(workspace_id=g.workspace.id,user_id=')

          # Replace the old membership-based activity lookup with the actual workspace id.
          old_query = 'Activity.query.join(Membership,Membership.user_id==Activity.user_id).filter(Membership.workspace_id==w.id)'
          s = s.replace(old_query, 'Activity.query.filter(Activity.workspace_id==w.id)')

          # Make deletion verify workspace ownership directly.
          old_delete = 'if not Membership.query.filter_by(workspace_id=w.id,user_id=a.user_id).first():\n        return error("Activity not found.",404,"ACTIVITY_NOT_FOUND")'
          new_delete = 'if a.workspace_id != w.id:\n        return error("Activity not found.",404,"ACTIVITY_NOT_FOUND")'
          s = s.replace(old_delete, new_delete, 1)

          # Add a small startup migration for existing production databases. Existing
          # activities are assigned to each user's first workspace; new rows are exact.
          marker = 'with app.app_context():\n    db.create_all()\n'
          migration = '''with app.app_context():\n    db.create_all()\n    try:\n        # db.create_all() does not add columns to an existing table.\n        cols = {row[1] for row in db.session.execute(db.text("PRAGMA table_info(activity)"))}\n        if "workspace_id" not in cols:\n            db.session.execute(db.text("ALTER TABLE activity ADD COLUMN workspace_id INTEGER"))\n            db.session.commit()\n        # Backfill legacy activity using the user's earliest workspace.\n        db.session.execute(db.text("""\n            UPDATE activity\n            SET workspace_id = (\n                SELECT workspace_id FROM workspace_memberships wm\n                WHERE wm.user_id = activity.user_id\n                ORDER BY wm.created_at ASC, wm.id ASC LIMIT 1\n            )\n            WHERE workspace_id IS NULL\n        """))\n        db.session.commit()\n    except Exception:\n        db.session.rollback()\n        logger.exception("activity workspace migration skipped")\n'''
          if marker in s and 'activity workspace migration skipped' not in s:
              s = s.replace(marker, migration, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py
          git diff --cached --quiet && exit 0
          git commit -m "Automated: scope activity to workspace"
          git push
