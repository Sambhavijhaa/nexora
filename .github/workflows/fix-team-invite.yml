name: Fix team invite endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Sambhavijhaa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Team invitation API call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Team.tsx')
          s = p.read_text()
          old = 'const{data}=await api.post("/team/invite-link",{email:inviteEmail.trim(),role:inviteRole});const link=data.invitationLink;if(!link)throw new Error("Invitation link was not returned.");setInviteLink(link);'
          new = 'const{data}=await api.post("/team/invite",{email:inviteEmail.trim(),role:inviteRole});const token=data.invitation?.token;if(!token)throw new Error("Invitation token was not returned by the server.");const link=`${window.location.origin}/invite/${encodeURIComponent(token)}`;setInviteLink(link);'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Team.tsx
          git diff --cached --quiet || git commit -m 'Fix team member invitation network error'
          git push
